server {
    listen 80;
    server_name imoon.plexus.lv;

    root /var/www/imoon;
    index index.html;

    # Flutter web app (PWA)
    location /app/ {
        alias /var/www/imoon/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
        location ~* \.(js|css|png|jpg|gif|ico|wasm|json)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # APK download
    location /download/ {
        alias /var/www/imoon/download/;
        add_header Content-Disposition "attachment";
    }

    # Landing page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
