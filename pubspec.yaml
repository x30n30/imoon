name: imoon
description: Period tracker — local-first, simple, beautiful.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database (local SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.1.1
  sqlite3_flutter_libs: ^0.5.24

  # State management
  flutter_riverpod: ^2.5.1

  # Calendar widget
  table_calendar: ^3.1.2

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Fonts & icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  fonts:
    - family: IMoon
      fonts:
        - asset: assets/fonts/placeholder.ttf
